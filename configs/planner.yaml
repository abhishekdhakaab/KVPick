model: Qwen/Qwen3-4B-Instruct-2507
gpu: NVIDIA A40
kv_bytes_per_token_raw: 147456
formats:
  raw:       {bytes_per_token: 147456, feasibility_name: raw}
  int8_row:  {bytes_per_token: 76032,  feasibility_name: int8_row}      # 2112 B/token/layer x 36
  int4_kivi: {bytes_per_token: 46080,  feasibility_name: int4_kivi}     # 1280 B/token/layer x 36
transfer:
  mode: serial            # t_send = compress + wire + decompress (conservative; pipelining can hide at most the kernel time)
  rtt_ms: 0.5
slo:
  itl_ms: 60              # a recompute on the decode GPU must not stall running decodes by more than this
defaults:
  decode_batch: 8
